import static org.gradle.api.tasks.wrapper.Wrapper.DistributionType

plugins {
    id 'org.springframework.boot' version '2.3.3.RELEASE'
    id 'io.spring.dependency-management' version '1.0.9.RELEASE'
    id 'java'
    id 'groovy'
	id 'jacoco'
}

group = 'ai.pupil'
version = 'RELEASE'
sourceCompatibility = '1.11'
targetCompatibility = '1.11'

wrapper {
    gradleVersion = '5.6'
    distributionType = DistributionType.ALL
}

ext['log4j2.version'] = '2.17.1'

dependencyManagement {
	imports {
		mavenBom 'com.amazonaws:aws-java-sdk-bom:1.11.416'
	}
}


repositories {
	mavenLocal()
	mavenCentral()	
}
dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.4'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springframework.retry:spring-retry:1.1.5.RELEASE'
	//implementation 'org.springframework:spring-aspects:6.0.11'
    implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.1.0.RELEASE'
    implementation 'org.springframework.cloud:spring-cloud-aws-autoconfigure:2.1.0.RELEASE'
    implementation 'org.springframework.cloud:spring-cloud-aws-messaging:2.1.0.RELEASE'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.auth0:auth0:2.11.0'
    implementation 'com.auth0:auth0-spring-security-api:1.1.0'
    implementation 'com.google.guava:guava:26.0-jre'
    implementation 'com.neovisionaries:nv-i18n:1.21'
    implementation 'com.newrelic.agent.java:newrelic-api:4.8.0'
    implementation 'io.springfox:springfox-bean-validators:2.9.2'
    implementation 'io.springfox:springfox-swagger2:2.9.2'
    implementation 'io.springfox:springfox-swagger-ui:2.9.2'
    implementation 'com.amazonaws:aws-java-sdk-secretsmanager'
    implementation 'com.github.fge:json-patch:1.9'
    implementation 'com.google.maps:google-maps-services:0.14.0'
    implementation 'org.apache.commons:commons-collections4:4.2'
    implementation 'org.apache.commons:commons-lang3:3.0'
	implementation 'org.modelmapper:modelmapper:3.1.1'
	implementation 'org.hibernate.validator:hibernate-validator:6.1.5.Final'
	implementation 'com.mashape.unirest:unirest-java:1.3.1'

    testCompileOnly 'org.projectlombok:lombok:1.18.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.spockframework:spock-core:1.2-groovy-2.4'
    testImplementation 'org.spockframework:spock-spring:1.2-groovy-2.4'
    testImplementation 'cglib:cglib-nodep:3.2.5'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok:1.18.4'
}

jacocoTestReport {
    reports {
        xml.enabled = false
        html.enabled = true
    }
}


