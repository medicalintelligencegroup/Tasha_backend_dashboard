import static org.gradle.api.tasks.wrapper.Wrapper.DistributionType

plugins {
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
    id 'maven-publish' 
}

group = 'com.mig'
version = 'RELEASE'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

wrapper {
    gradleVersion = '9.2.1'
    distributionType = DistributionType.ALL
}

ext['log4j2.version'] = '2.17.1'

dependencyManagement {
    imports {
        mavenBom 'com.amazonaws:aws-java-sdk-bom:1.11.416'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.30'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.retry:spring-retry:1.1.5.RELEASE'
    implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.1.0.RELEASE'
    implementation 'org.springframework.cloud:spring-cloud-aws-autoconfigure:2.1.0.RELEASE'
    implementation 'org.springframework.cloud:spring-cloud-aws-messaging:2.1.0.RELEASE'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.auth0:auth0:2.11.0'
    implementation 'com.auth0:auth0-spring-security-api:1.1.0'
    implementation 'com.google.guava:guava:26.0-jre'
    implementation 'com.neovisionaries:nv-i18n:1.21'
    implementation 'com.newrelic.agent.java:newrelic-api:4.8.0'
    implementation 'io.springfox:springfox-bean-validators:2.9.2'
    implementation 'io.springfox:springfox-swagger2:2.9.2'
    implementation 'io.springfox:springfox-swagger-ui:2.9.2'
    implementation 'com.amazonaws:aws-java-sdk-secretsmanager'
    implementation 'com.github.fge:json-patch:1.9'
    implementation 'com.google.maps:google-maps-services:0.14.0'
    implementation 'org.apache.commons:commons-collections4:4.2'
    implementation 'org.apache.commons:commons-lang3:3.0'
    implementation 'org.modelmapper:modelmapper:3.1.1'
    implementation 'org.hibernate.validator:hibernate-validator:6.1.5.Final'
    implementation 'com.mashape.unirest:unirest-java:1.3.1'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'

    testCompileOnly 'org.projectlombok:lombok:1.18.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo:4.17.0'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'junit:junit:4.13.2'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

jacocoTestReport {
    reports {
        xml.required.set(false)
        html.required.set(true)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
        mavenCentral()
    }
}


